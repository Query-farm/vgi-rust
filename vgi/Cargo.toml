[package]
name = "vgi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Build VGI workers in Rust to extend DuckDB with custom catalogs, functions, and tables over Apache Arrow IPC"
readme = "README.md"
keywords = ["vgi", "duckdb", "arrow", "rpc", "worker"]
categories = ["database", "api-bindings"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["sqlite", "transport-http", "catalog-publication", "blob-vendor", "storage-s3"]
# Durable single-file SQLite storage backend (bundles libsqlite3 — compiles C).
sqlite = ["dep:rusqlite"]
# HTTP client storage backend (talks to a vgi-storage-server); for multi-instance
# deployments (e.g. fly.io) where workers share one durable store.
http-storage = ["dep:ureq", "dep:bincode"]
# Cloudflare Durable Object storage client (talks to the
# vgi-cloudflare-durable-object-storage Worker, shared with the Python, Go, Java
# and TypeScript SDKs). HTTPS via ureq + rustls (ring, webpki roots).
cloudflare-do = ["dep:ureq", "ureq/rustls"]
# HTTP *worker* transport (`--http`, axum/tokio). Pulls the tokio runtime and the
# vgi-rpc http stack. Off for wasm builds (tokio/mio/zstd don't compile to wasm);
# the wasm worker serves over stdio (and, on wasip2, raw TCP).
#
# It also carries Orchard hosted mode (`VGI_ORCHARD_HOSTED=1`, see
# `src/hosted.rs`): every HTTP worker image can run hosted, so the Pass
# verifier is not a separate feature. jsonwebtoken verifies the ES256 Pass;
# ureq (sync, no runtime of its own, rustls) fetches the JWKS.
transport-http = ["dep:tokio", "vgi-rpc/http", "dep:jsonwebtoken", "dep:ureq", "ureq/rustls", "dep:axum"]
# Blob-vendor externalization (vgi-rpc-s3's `vendor` client): large storage
# values kept in the vendor (`storage::blobs`), and over HTTP, with
# VGI_BLOB_VENDOR_URL set, large results externalized and client upload URLs
# vended. Pulls reqwest (blocking, rustls). A default feature: Orchard hosts
# every worker image with the vendor set, and a hosted worker built without it
# refuses to start rather than serve without externalization.
blob-vendor = ["transport-http", "dep:vgi-rpc-s3"]
# Direct S3 storage (`VGI_STORAGE_BACKEND=s3` / `VGI_STORAGE_S3_BUCKET`): the
# worker signs its own URLs against the operator's bucket (AWS S3 or any
# S3-compatible service) with the standard AWS credential chain. Pulls
# aws-config. A default feature, so every self-hosted worker can use its own
# bucket from the environment alone.
storage-s3 = ["blob-vendor", "vgi-rpc-s3/aws"]

catalog-publication = ["vgi-rpc/external", "dep:zstd"]

[dependencies]
zstd = { version = "0.13", optional = true }
# `crypto` (XChaCha20-Poly1305 seal/open) is enabled unconditionally, NOT via
# `transport-http`: split tokens (`src/split_token.rs`) are a core feature that
# must work on every transport, wasm included. It carries no server stack —
# AEAD + RNG + base64 only — so it does not compromise the wasm build.
vgi-rpc = { workspace = true, features = ["crypto"] }
vgi-rpc-s3 = { workspace = true, optional = true }
# Split-token bind fingerprint (see src/split_token.rs). Already in the lock
# file via a transitive dependency, so this adds no new crate to the build.
sha2 = "0.10"
# Sealed framework storage payloads (src/storage/seal.rs): AES-256-GCM, the
# cross-SDK format. Pure Rust (wasm-safe) and already in the lock file.
aes-gcm = "0.10"
# Attach tickets (src/attach_ticket.rs): canonical unpadded base64url. The CSPRNG
# (rand) also backs the HTTP signing key generated when none is configured,
# execution / session ids (they land inside opaque values), and ticket nonces
# and ids. Both already in the lock file through vgi-rpc's `crypto` feature.
base64 = "0.22"
rand = "0.8"
# `AttachTicket.expires_at` is a `vgi_rpc::UtcTimestamp` (a chrono instant).
# Already in the lock file through vgi-rpc.
chrono = { version = "0.4", default-features = false }
vgi-protocol = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
arrow-cast = { workspace = true }
arrow-arith = { workspace = true }
arrow-ord = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
log = { workspace = true }
# tokio only backs the HTTP worker transport; optional + gated so the crate
# compiles for wasm (where tokio's rt-multi-thread/net features are unsupported).
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"], optional = true }
# The HTTP worker's router (feature `transport-http`): vgi-rpc builds it, the
# worker layers `VGI-Arguments-Ref-Bytes` onto every response. Already in the
# build through vgi-rpc's `http` feature, same major.
axum = { version = "0.8", optional = true }
# SQLite storage backend (feature `sqlite`). `bundled` compiles a vendored
# libsqlite3 so there is no system dependency; this is the one C-compiled dep.
# 0.41 (libsqlite3-sys 0.39, bundled SQLite 3.53.x) for RUSTSEC-2026-0459; MSRV 1.97 is fine.
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
# HTTP storage client (feature `http-storage`). `ureq` is a pure-sync blocking
# client — safe to call from a worker served over stdio OR inside a tokio HTTP
# runtime (no async nesting). `bincode` frames the request/response.
ureq = { version = "3", default-features = false, optional = true }
# Orchard hosted mode's Pass verifier (feature `transport-http`). Same version
# and crypto backend as vgi-rpc's `jwt-jsonwebtoken`, so the two never select
# different jsonwebtoken providers in one build.
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"], optional = true }
bincode = { version = "2", features = ["serde"], optional = true }

# Unix-only: used to namespace the cross-process store base dir by uid (so users
# sharing a /tmp don't collide) and to chmod it 0o700. `libc` is pure Rust (extern
# declarations only — it compiles no C), so the single-binary build is unaffected.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ctrlc installs an OS signal handler for the unix/tcp launcher transports'
# graceful shutdown — not available (or needed) on wasm, which serves over stdio
# and exits on EOF.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3"

[dev-dependencies]
# ES256 key generation for the hosted-mode tests' Passes (already in the build
# through jsonwebtoken's `aws_lc_rs` backend).
aws-lc-rs = "1"
# Lightweight blocking HTTP client to drive the loopback HTTP server in the
# producer-continuation tests (no TLS needed for 127.0.0.1).
ureq = { version = "3", default-features = false }
