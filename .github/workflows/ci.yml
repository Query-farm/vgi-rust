name: CI

# fmt / clippy / build / doc on the workspace. The full VGI integration suite
# (test/sql/integration/*) is NOT run here — it drives the C++ DuckDB `vgi`
# extension's `unittest` binary against the worker, which isn't available on a
# stock runner. Run it locally with `scripts/run_tests.sh`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Every workspace crate — the published ones and the fixtures — is gated
      # clippy-clean under `-D warnings`, tests and examples included. Clippy
      # only type-checks (it never links), so `--all-features` is safe here even
      # though `vgi-example-worker`'s `coverage` feature cannot link without
      # `-Cinstrument-coverage` (see the build steps below). The other feature
      # combinations are covered by the `features` job.
      - name: cargo clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `vgi-example-worker`'s `coverage` feature FFI-links the LLVM profiling
      # runtime (`__llvm_profile_write_file`), which only exists under
      # `-Cinstrument-coverage` (set by the integration `coverage` lane). A plain
      # `--all-features` build would fail to link it, so exclude the fixture from
      # the all-features sweep and build it separately with its default features.
      - name: cargo build (workspace, all features)
        run: cargo build --workspace --exclude vgi-example-worker --all-features

      - name: cargo build (example worker)
        run: cargo build -p vgi-example-worker

      # The `vgi.v2` surface must hash to the reference's: drift in any method
      # registration, schema, field order or nullability fails here.
      - name: cargo test (vgi.v2 surface + wire name)
        run: cargo test -p vgi --all-features --test vgi_v2_surface --test protocol_name

      - name: cargo test --doc (vgi)
        run: cargo test --doc -p vgi --all-features

      - name: cargo doc (vgi)
        run: cargo doc -p vgi --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # vgi-rpc's hosted-protocols group against the example fixture worker
  # (MULTI_PROTOCOL_HOSTING.md §5/§7): reflection lists `vgi.v2` then
  # `conformance.Secondary.v1` -- deliberately non-alphabetical, so a server
  # that sorts its listing fails -- the secondary passes the routing,
  # error-model and traceback groups, and over HTTP the fixture's opted-in
  # `vgi_rpc.Identity.v1` passes the identity groups. Run on every transport
  # the worker serves.
  #
  # The suite comes from vgi-rpc-python `main`, unpinned by design (the same
  # pattern as vgi-rpc-rust's conformance job): a coordinated protocol change
  # must be verifiable before either side is published.
  hosted-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the vgi-rpc-python conformance suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi-rpc-python
          path: vgi-rpc-python

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the hosted-protocols runner
        run: |
          python -m pip install --upgrade pip
          pip install -e "./vgi-rpc-python[http,conformance]" pytest pytest-timeout

      - name: Build the example worker
        run: cargo build -p vgi-example-worker

      - name: Hosted protocols over stdio
        run: >-
          vgi-rpc-test-hosted --cmd "$GITHUB_WORKSPACE/target/debug/vgi-example-worker"
          --expect vgi.v2,conformance.Secondary.v1

      - name: Hosted protocols over a unix socket
        shell: bash
        run: |
          set -euo pipefail
          sock=/tmp/vgi-hosted.sock
          rm -f "$sock"
          target/debug/vgi-example-worker --unix "$sock" --idle-timeout 600 > unix.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 100); do [ -S "$sock" ] && break; sleep 0.1; done
          [ -S "$sock" ] || { cat unix.log; exit 1; }
          vgi-rpc-test-hosted --unix "$sock" --expect vgi.v2,conformance.Secondary.v1

      - name: Hosted protocols over HTTP, with Identity opted in
        shell: bash
        run: |
          set -euo pipefail
          target/debug/vgi-example-worker --http --identity > http.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          port=""
          for _ in $(seq 100); do
            port="$(sed -n 's/.*PORT:\([0-9]*\).*/\1/p' http.log | head -1)"
            [ -n "$port" ] && break
            sleep 0.1
          done
          [ -n "$port" ] || { cat http.log; exit 1; }
          vgi-rpc-test-hosted --url "http://127.0.0.1:$port" \
            --expect vgi.v2,conformance.Secondary.v1 --identity

  # Feature hygiene for the crates with optional features. Each crate is linted
  # on its own (no workspace feature unification) with no default features,
  # its defaults, each optional feature alone, and all features — so a test or
  # helper that quietly depends on a feature it does not declare is a compile
  # error or a dead-code warning here rather than a surprise for a downstream
  # `default-features = false` build.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # Tests and examples included.
      - name: cargo hack clippy --each-feature (all targets)
        run: cargo hack clippy -p vgi -p vgi-client -p vgi-example-worker --each-feature --all-targets -- -D warnings

      # The libraries alone. Building tests activates dev-dependency features
      # (vgi-client's tests pull `vgi` with its defaults, and with it the
      # vgi-rpc HTTP stack), which can hide a missing feature in the library
      # itself; without them this is exactly what a dependent crate compiles.
      - name: cargo hack clippy --each-feature (libraries only)
        run: cargo hack clippy -p vgi -p vgi-client --each-feature -- -D warnings

  # Windows has no AF_UNIX launcher transport: the `vgi` crate must still
  # compile (stdio + http transports stay available). Guards against the
  # `serve_unix` AF_UNIX path regressing the cross-platform build.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (vgi)
        run: cargo build -p vgi --all-features

  # Build AND run every ```rust worker example in the docs end-to-end: each is
  # compiled against the local `vgi`, attached in Haybarn (Query Farm's DuckDB
  # distribution, which provides the `vgi` extension), and its `upper_case`
  # function is exercised. Guarantees the copy-paste examples never drift.
  doc-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Install uv (for haybarn-cli)
        uses: astral-sh/setup-uv@v5

      - name: Build and run the doc examples
        run: bash scripts/check_doc_examples.sh
