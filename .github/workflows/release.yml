name: Release

# Publish the `vgi` crate to crates.io when a `v*` tag is pushed, using
# crates.io Trusted Publishing (OIDC) — no long-lived CARGO_REGISTRY_TOKEN
# secret required. `vgi-example-worker` is `publish = false` (a test fixture).
#
# Setup checklist (one-time):
#   1. Register `vgi` on crates.io as a Trusted Publisher bound to this repo
#      (Query-farm/vgi-rust), this workflow file (release.yml), and the
#      `crates-io` environment below. For a brand-new crate name, configure the
#      trusted publisher before the first release (or do the very first publish
#      with a token, then switch to OIDC).
#   2. Create a GitHub Environment named `crates-io` (Settings → Environments)
#      with required reviewers, so a release requires a human approval click.
#
# Release flow:
#   1. Bump the workspace version in the root `Cargo.toml`.
#   2. Update README / docs as needed.
#   3. `git tag v0.1.0 && git push origin v0.1.0`.
#   4. Approve the workflow run in the `crates-io` environment.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run `cargo publish --dry-run` instead of publishing."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Sanity gate — fmt, clippy, build, doctests
        run: |
          cargo fmt --all -- --check
          cargo clippy -p vgi --all-targets --all-features -- -D warnings
          # Build every crate with default features, then the published crate
          # with all of ITS features. Not `--workspace --all-features`: that
          # turns on vgi-example-worker's `coverage` feature, whose FFI into the
          # LLVM profile runtime only links under `-Cinstrument-coverage`.
          cargo build --workspace
          cargo build -p vgi --all-features
          cargo test --doc -p vgi --all-features

      - name: Authenticate to crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Publish in dependency order. `vgi` gained a dependency on the
      # `vgi-protocol` crate after v0.29.0, and this step still published only
      # `-p vgi` — which cannot work, because cargo resolves a path+version
      # dependency against the REGISTRY when packaging, and vgi-protocol had
      # never been published (crates.io returned 404 for it). The first tag
      # after the split would have failed here.
      #
      # Order is vgi-protocol -> vgi -> vgi-client (vgi-client depends on both).
      # vgi-example-worker / vgi-storage-server / vgi-docs-examples are
      # `publish = false` and excluded.
      #
      # Idempotent by design: a version already on crates.io is skipped rather
      # than failing the job, so a re-run after a partial publish completes the
      # remainder instead of needing a version bump.
      - name: Publish crates in dependency order
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='vgi'))")
          echo "Publishing workspace version $version"

          already_published() {
            # 200 with a matching version => this exact version exists.
            curl -sf "https://crates.io/api/v1/crates/$1/$2" \
              -H 'User-Agent: vgi-release' >/dev/null 2>&1
          }

          for crate in vgi-protocol vgi vgi-client; do
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "::group::dry-run $crate"
              cargo publish --dry-run -p "$crate"
              echo "::endgroup::"
              continue
            fi

            if already_published "$crate" "$version"; then
              echo "$crate $version already on crates.io — skipping"
              continue
            fi

            echo "::group::publish $crate $version"
            cargo publish -p "$crate"
            echo "::endgroup::"

            # cargo publish waits for the index, but the sparse index and the
            # API can lag each other by a few seconds. The next crate in the
            # chain resolves this one from the registry, so confirm it is
            # actually visible before moving on.
            for _ in $(seq 1 60); do
              if already_published "$crate" "$version"; then
                echo "$crate $version is visible on crates.io"
                break
              fi
              sleep 5
            done
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        # Publishing here is triggered by a *tag push*, unlike the SDK repos
        # that publish in response to a published Release — so nothing ever
        # created one, and this repo sat at 26 tags / 4 Releases with GitHub
        # advertising a version far behind crates.io. Notes come from the
        # annotated tag message, since this repo keeps no CHANGELOG.
        # Idempotent: a re-run after a partial publish skips rather than fails.
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag

      - name: Summarise
        if: success()
        run: |
          echo "Published vgi from tag ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}"
          echo "  - https://crates.io/crates/vgi"
