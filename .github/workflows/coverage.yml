#
# Expensive, manually requested coverage audit. Normal push and pull-request CI
# runs the uninstrumented stdio, launcher, and HTTP integration lanes instead.
name: Worker coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  VGI_REF: main

jobs:
  # Run BOTH subprocess and launcher and merge their profiles. Launcher workers
  # can be killed before early counters are flushed; stdio supplies accurate
  # bind-time coverage while launcher adds its pooled-worker paths.
  coverage:
    name: worker / Linux stdio+launch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Checkout current vgi test suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      - name: Install Rust toolchain (MSRV 1.97) + llvm-tools
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Build instrumented worker
        run: cargo build --release -p vgi-example-worker --features coverage
        env:
          RUSTFLAGS: -Cinstrument-coverage

      - name: Resolve latest haybarn release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh release view --repo Query-farm-haybarn/haybarn --json tagName --jq .tagName)"
          echo "HAYBARN_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Download + extract haybarn-unittest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$HAYBARN_RELEASE" --repo Query-farm-haybarn/haybarn \
            --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
          python3 -c "import zipfile; zipfile.ZipFile('hb.zip').extractall('hb')"
          ut="$(find hb -type f -name 'haybarn-unittest' | head -1)"
          chmod +x "$ut"
          echo "HAYBARN_UNITTEST=$(cd "$(dirname "$ut")" && pwd)/$(basename "$ut")" >> "$GITHUB_ENV"

      - name: Run integration suite (stdio) with coverage
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          TRANSPORT: stdio
          # coverage.rs periodically rewrites a complete snapshot. Do not use
          # %m (online merge): merging every cumulative snapshot into the same
          # file double-counts until LLVM counters overflow.
          LLVM_PROFILE_FILE: ${{ github.workspace }}/covdata/stdio-%p.profraw

      - name: Run integration suite (launcher) with coverage
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          TRANSPORT: launch
          LLVM_PROFILE_FILE: ${{ github.workspace }}/covdata/launch-%p.profraw

      - name: Merge + report coverage
        if: always()
        shell: bash
        run: ci/coverage-report.sh "${{ github.workspace }}/target/release/vgi-example-worker" "${{ github.workspace }}/covdata" "${{ github.workspace }}/coverage"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: coverage/
