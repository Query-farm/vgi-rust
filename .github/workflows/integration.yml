#
# Runs the canonical Query-farm/vgi integration sqllogictest suite against the
# Rust example worker across all three transports (subprocess / launcher / http).
# The framework builds its Rust worker and downloads a native runner linked
# with VGI from the same revision as the test suite.
# See ci/README.md.
name: Integration suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the test suite to the native runner built from this exact revision.
  VGI_REF: 7b1e1fbbe745d77fdacf52d6d135fa3ef4491d48
  VGI_NATIVE_RUNNER_BRANCH: release/vgi-v3-ci-20261028

jobs:
  integration:
    name: Linux / ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # All three transports execute the pinned suite and matching native extension.
      fail-fast: true
      matrix:
        transport: [stdio, launch, http]
    steps:
      - name: Checkout vgi-rust
        uses: actions/checkout@v5

      - name: Checkout current vgi test suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Build example worker
        run: cargo build --release -p vgi-example-worker

      - name: Fetch matching native integration runner
        run: >-
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py"
          --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.transport }})
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          TRANSPORT: ${{ matrix.transport }}
