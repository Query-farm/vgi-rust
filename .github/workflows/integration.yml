# Copyright 2025, 2026 Query Farm LLC - https://query.farm
#
# Runs the canonical Query-farm/vgi integration sqllogictest suite against the
# Rust example worker across all three transports (subprocess / launcher / http).
# A producer job builds the C++ extension from the exact same pinned VGI source
# as the tests, then every lane downloads that immutable workflow artifact. This
# deliberately avoids pairing tests from VGI main with an older community build.
# See ci/README.md.
name: Integration suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # One reviewed VGI revision is the authority for BOTH the suite and extension.
  # Update this full SHA deliberately; never point it at a moving branch.
  VGI_REF: 486c6a1f815dd896884b526cd29c937a81abb344
  # VGI_REF pins Haybarn engine commit 105edd31b57fe7e6d32ee648efad562e45a9f908.
  # This release's unittest runner is built from that same engine revision, so
  # its extension ABI/platform metadata matches the source-built artifact.
  HAYBARN_RELEASE: haybarn-v1.5.5-rc1

jobs:
  build-vgi-extension:
    name: Build pinned VGI extension (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEN: ninja
      USE_MERGED_VCPKG_MANIFEST: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout pinned VGI source
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-source
          submodules: recursive

      - name: Verify exact VGI revision
        working-directory: vgi-source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VGI_REF"

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: vgi-rust-source-extension-${{ env.VGI_REF }}

      - name: Export vcpkg cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        working-directory: vgi-source
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build release extension
        working-directory: vgi-source
        run: make release

      - name: Stage exact extension artifact
        shell: bash
        run: |
          mkdir -p vgi-extension-artifact
          cp vgi-source/build/release/extension/vgi/vgi.duckdb_extension vgi-extension-artifact/
          (cd vgi-extension-artifact && sha256sum vgi.duckdb_extension > SHA256SUMS)
          printf '%s\n' "$VGI_REF" > vgi-extension-artifact/VGI_REF

      - name: Upload pinned extension
        uses: actions/upload-artifact@v4
        with:
          name: vgi-extension-linux-amd64-${{ env.VGI_REF }}
          path: vgi-extension-artifact/
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Linux / ${{ matrix.transport }}
    needs: build-vgi-extension
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # All three public transports execute the same pinned suite and extension.
      fail-fast: true
      matrix:
        transport: [stdio, launch, http]
    steps:
      - name: Checkout vgi-rust
        uses: actions/checkout@v5

      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      - name: Verify exact VGI test revision
        shell: bash
        run: test "$(git -C vgi-upstream rev-parse HEAD)" = "$VGI_REF"

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Build example worker
        run: cargo build --release -p vgi-example-worker

      - name: Download + extract haybarn-unittest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$HAYBARN_RELEASE" --repo Query-farm-haybarn/haybarn \
            --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
          python3 -c "import zipfile; zipfile.ZipFile('hb.zip').extractall('hb')"
          ut="$(find hb -type f -name 'haybarn-unittest' | head -1)"
          chmod +x "$ut"
          echo "HAYBARN_UNITTEST=$(cd "$(dirname "$ut")" && pwd)/$(basename "$ut")" >> "$GITHUB_ENV"

      - name: Download exact VGI extension
        uses: actions/download-artifact@v4
        with:
          name: vgi-extension-linux-amd64-${{ env.VGI_REF }}
          path: vgi-extension

      - name: Verify extension provenance and digest
        shell: bash
        run: |
          test "$(cat vgi-extension/VGI_REF)" = "$VGI_REF"
          (cd vgi-extension && sha256sum --check SHA256SUMS)

      - name: Run integration suite (${{ matrix.transport }})
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          VGI_EXTENSION_PATH: ${{ github.workspace }}/vgi-extension/vgi.duckdb_extension
          TRANSPORT: ${{ matrix.transport }}

  # Measure what the VGI integration suite exercises in the worker. Linux only.
  #
  # Runs BOTH the subprocess (stdio) and launcher lanes and merges their
  # profiles. This matters for accuracy: a launcher/http worker is killed at
  # teardown without a clean exit, so counters for code that runs once early
  # (notably bind-time work like overload resolution) can be lost even with the
  # periodic flush — the launcher lane alone under-reports them badly (it read
  # overload.rs at ~8% when the suite actually covers ~95%). The stdio lane
  # spawns a fresh worker per query that exits cleanly (LLVM `atexit` writer), so
  # its counters are reliable; the launch lane adds the pooled-worker / launcher
  # code paths stdio never exercises. Together they give a trustworthy picture.
  coverage:
    name: coverage (worker / Linux stdio+launch)
    needs: build-vgi-extension
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      - name: Verify exact VGI test revision
        shell: bash
        run: test "$(git -C vgi-upstream rev-parse HEAD)" = "$VGI_REF"

      - name: Install Rust toolchain (MSRV 1.97) + llvm-tools
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Build instrumented worker
        run: cargo build --release -p vgi-example-worker --features coverage
        env:
          RUSTFLAGS: -Cinstrument-coverage

      - name: Download + extract haybarn-unittest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$HAYBARN_RELEASE" --repo Query-farm-haybarn/haybarn \
            --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
          python3 -c "import zipfile; zipfile.ZipFile('hb.zip').extractall('hb')"
          ut="$(find hb -type f -name 'haybarn-unittest' | head -1)"
          chmod +x "$ut"
          echo "HAYBARN_UNITTEST=$(cd "$(dirname "$ut")" && pwd)/$(basename "$ut")" >> "$GITHUB_ENV"

      - name: Download exact VGI extension
        uses: actions/download-artifact@v4
        with:
          name: vgi-extension-linux-amd64-${{ env.VGI_REF }}
          path: vgi-extension

      - name: Verify extension provenance and digest
        shell: bash
        run: |
          test "$(cat vgi-extension/VGI_REF)" = "$VGI_REF"
          (cd vgi-extension && sha256sum --check SHA256SUMS)

      - name: Run integration suite (stdio) with coverage
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          VGI_EXTENSION_PATH: ${{ github.workspace }}/vgi-extension/vgi.duckdb_extension
          TRANSPORT: stdio
          LLVM_PROFILE_FILE: ${{ github.workspace }}/covdata/stdio-%p-%m.profraw

      - name: Run integration suite (launcher) with coverage
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          VGI_EXTENSION_PATH: ${{ github.workspace }}/vgi-extension/vgi.duckdb_extension
          TRANSPORT: launch
          LLVM_PROFILE_FILE: ${{ github.workspace }}/covdata/launch-%p-%m.profraw

      - name: Merge + report coverage
        if: always()
        shell: bash
        run: ci/coverage-report.sh "${{ github.workspace }}/target/release/vgi-example-worker" "${{ github.workspace }}/covdata" "${{ github.workspace }}/coverage"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: coverage/
