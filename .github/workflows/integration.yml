#
# Runs the canonical Query-farm/vgi integration sqllogictest suite against the
# Rust example worker across all three transports (subprocess / launcher / http),
# plus the http transport against a fake blob vendor (vendor).
# The framework builds its Rust worker and downloads a native runner linked
# with VGI from the same revision as the test suite.
# See ci/README.md.
name: Integration suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the test suite to the native runner built from this exact revision.
  # f9e5df3 adds the blob-vendor lane's contract (test/sql/external_storage,
  # test/start_fake_blob_vendor.sh, docs/testing/blob-test-catalog.md).
  # 5b8b7a2 is vgi protocol-3.4: protocol 3.4.0, upload URLs v2,
  # external_storage/upload_integrity.test and the client-upload counters
  # (puts_upload / client_uploads); it includes 91f8d63
  # (scan_planning_predicates*.test over data.planned_events). 0283f91 adds
  # protocol 3.4 argument references and the arguments_ref*.test files the
  # vendor lane runs (arguments_ref_state_ref.test on a filtered producer
  # scan). TODO(release-wave).
  VGI_REF: 0283f91f98f69337708c9ce4c6a40706355d3aa5
  # The fake blob vendor with sized-PUT verification, the upload fault, the
  # origin=client_upload counters and the delete-object route (vgi-rpc-python
  # 6a21ee3); the same pin as start_fake_blob_vendor.sh at 0283f91.
  # TODO(release-wave).
  VGI_RPC_FAKE_VENDOR_REF: 6a21ee3b2fb21d9c348c9b615fd97dce8e0bb852
  VGI_NATIVE_RUNNER_BRANCH: protocol-3.4
  # vgi protocol-3.4 with the Orchard hosted-mode conformance harness
  # (test/hosted/run_hosted_conformance.py). TODO(release-wave).
  VGI_HOSTED_REF: 0283f91f98f69337708c9ce4c6a40706355d3aa5

jobs:
  # Orchard hosted mode (VGI_ORCHARD_HOSTED=1, vgi::hosted) against vgi's
  # SDK-neutral harness. Needs no native runner: the harness drives the
  # worker over raw HTTP and vgi-python's client.
  orchard-hosted-conformance:
    name: Linux / Orchard hosted mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout vgi-rust
        uses: actions/checkout@v5

      - name: Checkout the hosted-mode harness
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_HOSTED_REF }}
          path: vgi-hosted

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Install uv (the harness is a uv script)
        uses: astral-sh/setup-uv@v6

      - name: Build example worker
        run: cargo build -p vgi-example-worker

      - name: Run the hosted-mode conformance harness
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-hosted
          VGI_WORKER_BIN: target/debug/vgi-example-worker
        run: ci/hosted-conformance.sh

  integration:
    name: Linux / ${{ matrix.transport }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every lane executes the pinned suite and matching native extension.
      fail-fast: true
      matrix:
        # vendor = the http suite with everything externalized through vgi-rpc's
        # fake blob vendor, plus test/sql/external_storage/*.
        transport: [stdio, launch, http, vendor]
    steps:
      - name: Checkout vgi-rust
        uses: actions/checkout@v5

      - name: Checkout current vgi test suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Install uv (the vendor lane runs the fake blob vendor with uvx)
        if: matrix.transport == 'vendor'
        uses: astral-sh/setup-uv@v6

      - name: Build example worker
        run: cargo build --release -p vgi-example-worker

      - name: Fetch matching native integration runner
        run: >-
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py"
          --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.transport }})
        shell: bash
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/target/release/vgi-example-worker
          TRANSPORT: ${{ matrix.transport }}
