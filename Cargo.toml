[workspace]
resolver = "2"
members = ["vgi-protocol", "vgi-client", "vgi", "vgi-example-worker", "vgi-storage-server", "examples/docs"]


[workspace.package]
version = "0.30.0"
edition = "2021"
rust-version = "1.97"
license-file = "LICENSE"
authors = ["Query Farm LLC <hello@query.farm>"]
homepage = "https://query.farm"
repository = "https://github.com/Query-farm/vgi-rust"

[workspace.dependencies]
# Published on crates.io. For local co-development against an unreleased
# vgi-rpc, add an (uncommitted) `[patch.crates-io]` pointing at the checkout:
#   [patch.crates-io]
#   vgi-rpc = { path = "../vgi-rpc-rust/vgi-rpc" }
# Base features carry NO http (axum/tokio/mio/zstd) so the crate stays
# wasm-buildable. Native crates that need the HTTP stack re-enable it via their
# own feature (`vgi`'s `transport-http`, or an explicit `features = ["http"]`).
vgi-rpc = { version = "0.23.1", default-features = false, features = ["macros", "stream-codec", "shm"] }
# The direction-agnostic wire protocol (DTOs + Arrow codec + IPC helpers), shared
# by the worker framework and any client. Kept feature-free and wasm-buildable.
vgi-protocol = { version = "0.30.0", path = "vgi-protocol" }
# The VGI protocol client (attach, discovery, function calls).
vgi-client = { version = "0.30.0", path = "vgi-client" }
# Transport-level RPC client the VGI client is built on.
vgi-rpc-client = { version = "0.23.1", default-features = false }
arrow = { version = "59", default-features = false, features = ["ipc"] }
arrow-array = "59"
arrow-buffer = "59"
arrow-data = "59"
arrow-ipc = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-row = "59"
arrow-cast = "59"
arrow-arith = "59"
arrow-ord = "59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust regex (wasm-safe) for enforcing const-argument `pattern` constraints.
regex = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
