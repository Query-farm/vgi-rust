[workspace]
resolver = "2"
members = ["vgi-protocol", "vgi-client", "vgi", "vgi-example-worker", "vgi-storage-server", "examples/docs", "examples/external-data"]


[workspace.package]
version = "0.53.0"
edition = "2021"
rust-version = "1.97"
license-file = "LICENSE"
authors = ["Query Farm LLC <hello@query.farm>"]
homepage = "https://query.farm"
repository = "https://github.com/Query-farm/vgi-rust"

[workspace.dependencies]
# Base features carry NO http (axum/tokio/mio/zstd) so the crate stays
# wasm-buildable. Native crates that need the HTTP stack re-enable it via their
# own feature (`vgi`'s `transport-http`, or an explicit `features = ["http"]`).
vgi-rpc = { version = "0.33.0", default-features = false, features = ["macros", "stream-codec", "shm"] }
# The direction-agnostic wire protocol (DTOs + Arrow codec + IPC helpers), shared
# by the worker framework and any client. Kept feature-free and wasm-buildable.
vgi-protocol = { version = "0.53.0", path = "vgi-protocol" }
# The VGI protocol client (attach, discovery, function calls).
vgi-client = { version = "0.53.0", path = "vgi-client" }
# Transport-level RPC client the VGI client is built on.
vgi-rpc-client = { version = "0.33.0", default-features = false }
# The blob-vendor client (`vgi`'s `blob-vendor` feature).
vgi-rpc-s3 = { version = "0.33.0" }
arrow = { version = "59.2.0", default-features = false, features = ["ipc"] }
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-data = "59.2.0"
arrow-ipc = "59.2.0"
arrow-schema = "59.2.0"
arrow-select = "59.2.0"
arrow-row = "59.2.0"
arrow-cast = "59.2.0"
arrow-arith = "59.2.0"
arrow-ord = "59.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust regex (wasm-safe) for enforcing const-argument `pattern` constraints.
regex = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2


# TODO(release-wave): switch to the vgi-rpc release the wave cuts and drop this
# section. Until then every vgi-rpc-rust crate comes from the `protocol-3.4`
# branch commit with direct S3 storage (vgi-rpc-s3's `aws` feature,
# VGI_STORAGE_BACKEND) and the storage stall timeouts; patching them all keeps
# one copy of each.
[patch.crates-io]
vgi-rpc = { git = "https://github.com/Query-farm/vgi-rpc-rust", rev = "8e2a3f45ef60671ac0dd2e00a5b83733d6bf4d19" }
vgi-rpc-macros = { git = "https://github.com/Query-farm/vgi-rpc-rust", rev = "8e2a3f45ef60671ac0dd2e00a5b83733d6bf4d19" }
vgi-rpc-client = { git = "https://github.com/Query-farm/vgi-rpc-rust", rev = "8e2a3f45ef60671ac0dd2e00a5b83733d6bf4d19" }
vgi-rpc-iroh = { git = "https://github.com/Query-farm/vgi-rpc-rust", rev = "8e2a3f45ef60671ac0dd2e00a5b83733d6bf4d19" }
vgi-iroh-transport = { git = "https://github.com/Query-farm/vgi-rpc-rust", rev = "8e2a3f45ef60671ac0dd2e00a5b83733d6bf4d19" }
vgi-rpc-s3 = { git = "https://github.com/Query-farm/vgi-rpc-rust", rev = "8e2a3f45ef60671ac0dd2e00a5b83733d6bf4d19" }
